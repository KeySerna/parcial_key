# Puerto donde escucha el proxy (la p\u00e1gina web entra por aqu\u00ed)
server.port=${PORT:35000}

# Lista de backends a los que el proxy reenv\u00eda las peticiones, separados por coma.
# Si existe la variable de entorno BACKENDS la usa; si no, estos dos locales.
backends=${BACKENDS:http://localhost:45000,http://localhost:45001}